<div class="account-container" *ngIf="user">
    <div class="account-card">
        <span class="close-btn" (click)="onClose()">×</span>
        
        <h2>Account Settings</h2>

        <div class="user-details-summary">
            <p><strong>Username</strong> {{user.userName}}</p>
            <p><strong>Email</strong> {{user.email}}</p>
        </div>

        <div class="button-group-container">
            <button class="btn save" (click)="isEditModalOpen = true">Edit Profile</button>
            <button class="btn logout" (click)="logOut()">Logout</button>
            <button class="btn delete" (click)="deleteAccount()">Delete Account</button>
        </div>

        <div class="modal-backdrop" *ngIf="isEditModalOpen">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 style="margin-bottom: 20px; color: #1e293b;">Update Info</h3>
                </div>

                <div class="form-group">
                    <label>User Name</label>
                    <input type="text" [(ngModel)]="user.userName" />
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" [(ngModel)]="user.email" />
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" [(ngModel)]="user.password" placeholder="New password" />
                </div>

                <div class="button-group-container" style="flex-direction: row; margin-top: 20px;">
                    <button class="btn logout" style="flex: 1; background: #f1f5f9; color: #64748b;" (click)="isEditModalOpen = false">Cancel</button>
                    <button class="btn save" style="flex: 2;" (click)="saveChanges()">Confirm</button>
                </div>
            </div>
        </div>
    </div>
</div>
