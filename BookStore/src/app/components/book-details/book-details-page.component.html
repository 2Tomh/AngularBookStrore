<div class="container">

    <div *ngIf="book" class="book-card">

        <div class="header-section">
            <h1>{{book.title}}</h1>
            <h3>{{book.author}}</h3>
        </div>

        <div class="content-wrapper">
            <div class="image-col">
                <img [src]="book.imageUrl" class="book-cover">
            </div>

            <div class="info-col">
                <div *ngIf="book.description" class="description-box">
                    <h4>summary</h4>
                    <p class="description-text">{{book.description}}</p>
                </div>

                <div class="price-section">
                    <span class="price-tag">
                        Price: {{book.price | number:'1.2-2'}} ₪
                    </span>
                </div>

                <button class="add-to-cart-btn" (click)="addBookToCart(book)">
                    Add To Cart
                </button>

                <div *ngIf="cartMessage" class="cart-notification">
                    {{ cartMessage }}
                </div>
            </div>
        </div>
    </div>
</div>
