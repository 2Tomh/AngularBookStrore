<section class="admin-section discounts-section">
  <h2>Set Discounts for Users</h2>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Username</th>
          <th>Email</th>
          <th>Current Discount</th>
          <th>Set Discount</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td data-label="Username">{{ user.userName }}</td>
          <td data-label="Email">{{ user.email }}</td>
          <td data-label="Current Discount">{{ user.discount || 0 }}%</td>
          <td data-label="Set Discount">
            <input type="number" [(ngModel)]="user.newDiscount" name="discount_{{user.id}}" min="0" max="100" placeholder="%" />
            <button (click)="setDiscount(user.id, user.newDiscount)">Set</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
