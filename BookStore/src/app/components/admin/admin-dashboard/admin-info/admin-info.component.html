<section class="admin-section">
    <h2>Edit Admin Info</h2>
    <form (ngSubmit)="saveAdminChanges()">
        <label for="adminName">Name:</label>
        <input id="adminName" [(ngModel)]="admin.name" name="adminName" required />

        <label for="adminEmail">Email:</label>
        <input id="adminEmail" [(ngModel)]="admin.email" name="adminEmail" required disabled />

        <button type="submit">Save Changes</button>
    </form>
</section>
