<section class="admin-section discounts-section">
  <h2>Manage User Roles & Permissions</h2>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Username</th>
          <th>Email</th>
          <th>Role Selection</th>
          <th>Status Badge</th>
          <th data-label="Action">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td data-label="Username">{{ user.userName }}</td>
          <td data-label="Email">{{ user.email }}</td>
          <td data-label="Role">
            <select [(ngModel)]="user.role" (change)="updateUserRole(user)">
              <option value="Customer">Customer</option>
              <option value="Admin">Admin</option>
            </select>
          </td>
          <td data-label="Status">
            <span [class]="user.role === 'Admin' ? 'badge-admin' : 'badge-user'">
              {{user.role}}
            </span>
          </td>
          <td class="action-cell">
            <button class="btn-delete-user" (click)="deleteUser(user.id)">Delete User</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
